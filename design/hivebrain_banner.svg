<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" style="background:#070a13; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="960" fill="url(#bgGrad)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="200" cy="200" r="320" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />
  <circle cx="1400" cy="300" r="380" fill="#7c3aed" opacity="0.09" filter="url(#softGlow)" />
  <circle cx="800" cy="850" r="350" fill="#0284c7" opacity="0.07" filter="url(#softGlow)" />

  <!-- Subtle Network Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="960" />
    <line x1="300" y1="0" x2="300" y2="960" />
    <line x1="500" y1="0" x2="500" y2="960" />
    <line x1="700" y1="0" x2="700" y2="960" />
    <line x1="900" y1="0" x2="900" y2="960" />
    <line x1="1100" y1="0" x2="1100" y2="960" />
    <line x1="1300" y1="0" x2="1300" y2="960" />
    <line x1="1500" y1="0" x2="1500" y2="960" />
    <line x1="0" y1="160" x2="1600" y2="160" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="560" x2="1600" y2="560" />
    <line x1="0" y1="760" x2="1600" y2="760" />
  </g>

  <!-- Header Badge -->
  <g transform="translate(800, 110)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
    <circle cx="-145" cy="0" r="5" fill="#34d399" />
    <text x="-125" y="6" fill="#94a3b8" font-size="14" font-weight="600" letter-spacing="1">AUTONOMOUS AI-COS v1.0.0</text>
    <text x="75" y="6" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">PRO FLEET</text>
  </g>

  <!-- Brand Title -->
  <text x="800" y="240" text-anchor="middle" fill="url(#textGrad)" font-size="82" font-weight="900" letter-spacing="-1.5">HIVEBrain</text>
  <text x="800" y="300" text-anchor="middle" fill="#94a3b8" font-size="24" font-weight="500" letter-spacing="0.5">Autonomous AI Company Operating System &amp; 4-Layer Federated Meta-Brain</text>

  <!-- Highlight Feature Pills -->
  <g transform="translate(800, 360)">
    <!-- Pill 1: Non-Blocking Gateway -->
    <g transform="translate(-480, 0)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="600">⚡ Non-Blocking Gateway &lt;3ms</text>
    </g>

    <!-- Pill 2: Paperclip AI CEO -->
    <g transform="translate(-160, 0)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="600">🏢 Paperclip AI CEO Fleet</text>
    </g>

    <!-- Pill 3: Herdr Multi-Lane -->
    <g transform="translate(160, 0)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#0f172a" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#34d399" font-size="14" font-weight="600">🔄 Herdr 4-Lane Execution</text>
    </g>

    <!-- Pill 4: Dual-Track Reverse Eng -->
    <g transform="translate(480, 0)">
      <rect x="-130" y="-18" width="260" height="36" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="600">🔬 Dual-Track Reverse Eng</text>
    </g>
  </g>

  <!-- 3 Hero Architecture Cards -->
  <g transform="translate(140, 430)">

    <!-- CARD 1: User & Gateway Layer -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="400" height="420" rx="20" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
      <rect x="24" y="24" width="48" height="48" rx="12" fill="#38bdf8" fill-opacity="0.15" />
      <text x="48" y="54" text-anchor="middle" fill="#38bdf8" font-size="22" font-weight="800">⚡</text>

      <text x="90" y="46" fill="#f8fafc" font-size="20" font-weight="700">Non-Blocking Gateway</text>
      <text x="90" y="68" fill="#64748b" font-size="13" font-weight="500">&lt; 3ms Instant Handoff</text>

      <!-- Divider -->
      <line x1="24" y1="92" x2="376" y2="92" stroke="#334155" stroke-width="1" />

      <!-- Content Points -->
      <g transform="translate(24, 120)" font-size="14" fill="#cbd5e1">
        <text x="0" y="0" font-weight="600" fill="#38bdf8">1. Main Agent Never Blocks</text>
        <text x="0" y="22" font-size="13" fill="#94a3b8">Conversations proceed immediately without</text>
        <text x="0" y="40" font-size="13" fill="#94a3b8">waiting for multi-minute fleet workflows.</text>

        <text x="0" y="80" font-weight="600" fill="#38bdf8">2. Live Process DAG UI (:5174)</text>
        <text x="0" y="102" font-size="13" fill="#94a3b8">Real-time reactive node graph shows subtask</text>
        <text x="0" y="120" font-size="13" fill="#94a3b8">routing, model state, and error recovery.</text>

        <text x="0" y="160" font-weight="600" fill="#38bdf8">3. Zero-Zombie Process Guardian</text>
        <text x="0" y="182" font-size="13" fill="#94a3b8">Watches parent PID. Reaps child engines</text>
        <text x="0" y="200" font-size="13" fill="#94a3b8">cleanly on IDE close or session restart.</text>
      </g>
    </g>

    <!-- CARD 2: Autonomous AI CEO & Multi-Lane Fleet -->
    <g transform="translate(460, 0)" filter="url(#cardShadow)">
      <rect width="400" height="420" rx="20" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
      <rect x="24" y="24" width="48" height="48" rx="12" fill="#c084fc" fill-opacity="0.15" />
      <text x="48" y="54" text-anchor="middle" fill="#c084fc" font-size="22" font-weight="800">🏢</text>

      <text x="90" y="46" fill="#f8fafc" font-size="20" font-weight="700">Autonomous AI CEO</text>
      <text x="90" y="68" fill="#64748b" font-size="13" font-weight="500">Herdr &amp; OpenClaw Orchestrator</text>

      <!-- Divider -->
      <line x1="24" y1="92" x2="376" y2="92" stroke="#334155" stroke-width="1" />

      <!-- Content Points -->
      <g transform="translate(24, 120)" font-size="14" fill="#cbd5e1">
        <text x="0" y="0" font-weight="600" fill="#c084fc">1. 4-Lane Parallel Fleet</text>
        <text x="0" y="22" font-size="13" fill="#94a3b8">Isolated Herdr multiplexer lanes for research,</text>
        <text x="0" y="40" font-size="13" fill="#94a3b8">schema design, engine code, and audits.</text>

        <text x="0" y="80" font-weight="600" fill="#c084fc">2. OpenClaw Loop Breaker</text>
        <text x="0" y="102" font-size="13" fill="#94a3b8">Real-time session auditor intercepts infinite loops,</text>
        <text x="0" y="120" font-size="13" fill="#94a3b8">stuck actions, and context bloat.</text>

        <text x="0" y="160" font-weight="600" fill="#c084fc">3. Dynamic Lane Self-Healing</text>
        <text x="0" y="182" font-size="13" fill="#94a3b8">Auto-promotes DeepSeek backups on 429 limits;</text>
        <text x="0" y="200" font-size="13" fill="#94a3b8">resumes directly from HIVEBrain state.</text>
      </g>
    </g>

    <!-- CARD 3: 4-Layer Federated Meta-Brain & REA -->
    <g transform="translate(920, 0)" filter="url(#cardShadow)">
      <rect width="400" height="420" rx="20" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.4" />
      <rect x="24" y="24" width="48" height="48" rx="12" fill="#34d399" fill-opacity="0.15" />
      <text x="48" y="54" text-anchor="middle" fill="#34d399" font-size="22" font-weight="800">🧠</text>

      <text x="90" y="46" fill="#f8fafc" font-size="20" font-weight="700">4-Layer Federated Brain</text>
      <text x="90" y="68" fill="#64748b" font-size="13" font-weight="500">PostgreSQL 18 &amp; Dual REA</text>

      <!-- Divider -->
      <line x1="24" y1="92" x2="376" y2="92" stroke="#334155" stroke-width="1" />

      <!-- Content Points -->
      <g transform="translate(24, 120)" font-size="14" fill="#cbd5e1">
        <text x="0" y="0" font-weight="600" fill="#34d399">1. Lock-Free MVCC Memory</text>
        <text x="0" y="22" font-size="13" fill="#94a3b8">Relational entities, JSONB events, pgvector 384d,</text>
        <text x="0" y="40" font-size="13" fill="#94a3b8">and Graphify topological knowledge graphs.</text>

        <text x="0" y="80" font-weight="600" fill="#34d399">2. Dual-Track Reverse Eng</text>
        <text x="0" y="102" font-size="13" fill="#94a3b8">Track 1: Chrome DevTools MCP &amp; dynamic DOM.</text>
        <text x="0" y="120" font-size="13" fill="#94a3b8">Track 2: Browser-free Go/Rust REA binary dissect.</text>

        <text x="0" y="160" font-weight="600" fill="#34d399">3. 5-Day Continuous Distillation</text>
        <text x="0" y="182" font-size="13" fill="#94a3b8">Autonomous Janitor consolidates knowledge,</text>
        <text x="0" y="200" font-size="13" fill="#94a3b8">pruning obsolete telemetry and vector noise.</text>
      </g>
    </g>

  </g>

  <!-- Footer Stats Bar -->
  <g transform="translate(800, 910)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="13" font-weight="500" letter-spacing="1">
      MULTI-MODEL COLLABORATION: ANTIGRAVITY &middot; CODEX PRO CLI &middot; DEEPSEEK R1 &middot; QWEN 3.8 MAX &middot; GPT-6 &middot; KIMI K3
    </text>
  </g>
</svg>
