<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="600" y="50" text-anchor="middle" fill="#f8fafc" font-size="28" font-weight="700" letter-spacing="1">HIVEBRAIN AI-COS: MASTER ARCHITECTURE</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-size="14">Autonomous AI Company Operating System &amp; 4-Layer Federated Meta-Brain (v1.0.0)</text>

  <!-- Gateway Box -->
  <rect x="100" y="110" width="1000" height="90" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="120" y="128" width="160" height="28" rx="6" fill="#0369a1"/>
  <text x="200" y="147" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">MAIN AGENT GATEWAY</text>
  <text x="300" y="148" fill="#f8fafc" font-size="16" font-weight="600">Non-Blocking User Dispatch Layer</text>
  <text x="300" y="172" fill="#94a3b8" font-size="13">Instantly enqueues tasks (&lt; 3ms handoff latency) | Preserves conversational readiness for user interaction</text>
  <rect x="940" y="135" width="140" height="38" rx="8" fill="#0f766e" filter="url(#glow)"/>
  <text x="1010" y="159" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">LATENCY: 2.74ms</text>

  <!-- Downward arrow -->
  <line x1="600" y1="200" x2="600" y2="240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="595,235 600,245 605,235" fill="#38bdf8"/>

  <!-- AI CEO Section -->
  <rect x="100" y="250" width="1000" height="120" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="120" y="270" width="170" height="28" rx="6" fill="#4338ca"/>
  <text x="205" y="289" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">SECOND AGENT: AI CEO</text>
  <text x="310" y="290" fill="#f8fafc" font-size="16" font-weight="600">Paperclip Orchestrator &amp; Sim.ai DAG Generator</text>
  <text x="310" y="315" fill="#94a3b8" font-size="13">Multi-Tier Routing: Tier 1 (Free First: Qwen 3.8 / GPT-6) → Tier 2 (DeepSeek Reasoner) → Tier 3 (Codex Pro)</text>
  <text x="310" y="340" fill="#94a3b8" font-size="13">Syncs Paperclip Issues (GHO-56/57) | Enforces OCC Version Checking | Manages Sub-Agent Workflows</text>
  <rect x="940" y="285" width="140" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="1010" y="306" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">SIM.AI BACKBONE</text>
  <text x="1010" y="324" text-anchor="middle" fill="#818cf8" font-size="11">DAG Child Workflows</text>

  <!-- Connectors from CEO to Herdr & OpenClaw -->
  <path d="M 350,370 L 350,410" stroke="#818cf8" stroke-width="2"/>
  <path d="M 850,370 L 850,410" stroke="#818cf8" stroke-width="2"/>

  <!-- Middle Row: Herdr Fleet & OpenClaw -->
  <rect x="100" y="415" width="480" height="135" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
  <rect x="120" y="430" width="160" height="26" rx="6" fill="#065f46"/>
  <text x="200" y="448" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="600">HERDR EXECUTION FLEET</text>
  <text x="120" y="478" fill="#f8fafc" font-size="14" font-weight="600">4 Parallel Execution Lanes</text>
  <text x="120" y="500" fill="#94a3b8" font-size="12">• Dedicated terminal multiplexing lanes</text>
  <text x="120" y="520" fill="#94a3b8" font-size="12">• Dynamic Lane Healer (Catches HTTP 429 &amp; context limits)</text>
  <text x="120" y="540" fill="#94a3b8" font-size="12">• Instant lane recycling upon subtask completion</text>

  <rect x="620" y="415" width="480" height="135" rx="12" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="640" y="430" width="170" height="26" rx="6" fill="#78350f"/>
  <text x="725" y="448" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="600">OPENCLAW SUPERVISOR</text>
  <text x="640" y="478" fill="#f8fafc" font-size="14" font-weight="600">Governance &amp; Session Audit</text>
  <text x="640" y="500" fill="#94a3b8" font-size="12">• Inter-agent transcript auditing via WebSocket</text>
  <text x="640" y="520" fill="#94a3b8" font-size="12">• Loop Breaker: Traps circular actions (≥ 3 repeats)</text>
  <text x="640" y="540" fill="#94a3b8" font-size="12">• Enforces context boundaries (120k characters)</text>

  <!-- Connectors to HIVEBrain 4-layer Store -->
  <path d="M 350,550 L 350,590 L 600,590 L 600,605" stroke="#34d399" stroke-width="2"/>
  <path d="M 850,550 L 850,590 L 600,590" stroke="#fbbf24" stroke-width="2"/>

  <!-- HIVEBrain 4-Layer Store -->
  <rect x="100" y="610" width="1000" height="145" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="120" y="625" width="230" height="26" rx="6" fill="#581c87"/>
  <text x="235" y="643" text-anchor="middle" fill="#f3e8ff" font-size="12" font-weight="600">HIVEBRAIN 4-LAYER METASTORE</text>
  
  <!-- 4 Sub-boxes -->
  <rect x="120" y="665" width="220" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="135" y="688" fill="#38bdf8" font-size="13" font-weight="700">L1: Relational (PostgreSQL)</text>
  <text x="135" y="708" fill="#94a3b8" font-size="11">• Milestones, entities &amp; claims</text>
  <text x="135" y="726" fill="#94a3b8" font-size="11">• Lease reservation locking</text>

  <rect x="365" y="665" width="220" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="380" y="688" fill="#a855f7" font-size="13" font-weight="700">L2: Semi-Structured JSONB</text>
  <text x="380" y="708" fill="#94a3b8" font-size="11">• Execution graphs &amp; DAG state</text>
  <text x="380" y="726" fill="#94a3b8" font-size="11">• OCC version-vector checks</text>

  <rect x="610" y="665" width="220" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="625" y="688" fill="#34d399" font-size="13" font-weight="700">L3: Vector Embeddings</text>
  <text x="625" y="708" fill="#94a3b8" font-size="11">• pgvector semantic centroids</text>
  <text x="625" y="726" fill="#94a3b8" font-size="11">• Cosine distance queries</text>

  <rect x="855" y="665" width="220" height="75" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="870" y="688" fill="#fbbf24" font-size="13" font-weight="700">L4: Knowledge Graph</text>
  <text x="870" y="708" fill="#94a3b8" font-size="11">• Graphify AST dependency nodes</text>
  <text x="870" y="726" fill="#94a3b8" font-size="11">• Transactional Outbox fan-out</text>

  <!-- Live Viewer Float -->
  <rect x="860" y="40" width="240" height="50" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <circle cx="880" cy="65" r="5" fill="#22c55e"/>
  <text x="895" y="60" fill="#f8fafc" font-size="12" font-weight="600">Sim Live Process Viewer</text>
  <text x="895" y="76" fill="#38bdf8" font-size="11">http://localhost:5174/</text>
</svg>
