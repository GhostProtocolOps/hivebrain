<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">DUAL-TRACK AUTOMATED REVERSE ENGINEERING ENGINE</text>
  <text x="600" y="72" text-anchor="middle" fill="#94a3b8" font-size="14">Intelligent Ingestion Router: Dynamic Web/Extension vs. Static Local Binary (v1.0.0)</text>

  <!-- Ingestion Router Box -->
  <rect x="350" y="95" width="500" height="70" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="125" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="600">Automated Artifact Classifier</text>
  <text x="600" y="148" text-anchor="middle" fill="#94a3b8" font-size="12">Inspects Magic Bytes, File Signatures &amp; Manifest Markers</text>

  <!-- Branch lines -->
  <path d="M 450,165 L 450,210 L 300,210 L 300,230" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 750,165 L 750,210 L 900,210 L 900,230" stroke="#a855f7" stroke-width="2" fill="none"/>

  <!-- Left Column: Track 1 -->
  <rect x="50" y="235" width="520" height="490" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="70" y="250" width="480" height="34" rx="6" fill="#0369a1"/>
  <text x="310" y="272" text-anchor="middle" fill="#e0f2fe" font-size="14" font-weight="700">TRACK 1: DYNAMIC WEB &amp; EXTENSION DISSECTION</text>
  <text x="70" y="306" fill="#7dd3fc" font-size="12" font-weight="600">Requires Managed Chrome Profile &amp; CDP Runtime</text>

  <!-- Tool 1: Chrome DevTools MCP -->
  <rect x="70" y="325" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="348" fill="#38bdf8" font-size="14" font-weight="600">1. Chrome DevTools MCP (Managed Automation Profile)</text>
  <text x="90" y="370" fill="#94a3b8" font-size="12">• Flags: --categoryExtensions, --categoryInput, --experimentalDevtools</text>
  <text x="90" y="390" fill="#94a3b8" font-size="12">• Inspects live DOM, background service workers &amp; storage state</text>

  <!-- Tool 2: Craft Anything -->
  <rect x="70" y="420" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="443" fill="#38bdf8" font-size="14" font-weight="600">2. Craft Anything (craft-anything-cli / MCP)</text>
  <text x="90" y="465" fill="#94a3b8" font-size="12">• Toolsets: browser, javascript, formats</text>
  <text x="90" y="485" fill="#94a3b8" font-size="12">• Surface triage, bundle AST analysis, clean-room boundary specs</text>

  <!-- Tool 3: REA Assistant -->
  <rect x="70" y="515" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="538" fill="#38bdf8" font-size="14" font-weight="600">3. REA (Reverse Engineering Assistant)</text>
  <text x="90" y="560" fill="#94a3b8" font-size="12">• Webpack, Parcel &amp; Rollup bundle unwrapping</text>
  <text x="90" y="580" fill="#94a3b8" font-size="12">• Source-map reconstruction &amp; sensitive release exposure audit</text>

  <!-- Synthesis Track 1 -->
  <rect x="70" y="610" width="480" height="95" rx="8" fill="#0c4a6e" stroke="#0284c7"/>
  <text x="90" y="635" fill="#f0f9ff" font-size="13" font-weight="700">Track 1 Deliverable: Live Forensic Specification</text>
  <text x="90" y="658" fill="#bae6fd" font-size="12">• Full accessibility hierarchy &amp; control action matrix</text>
  <text x="90" y="678" fill="#bae6fd" font-size="12">• Clean-room architecture specification with 0% code contamination</text>

  <!-- Right Column: Track 2 -->
  <rect x="630" y="235" width="520" height="490" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="650" y="250" width="480" height="34" rx="6" fill="#581c87"/>
  <text x="890" y="272" text-anchor="middle" fill="#f3e8ff" font-size="14" font-weight="700">TRACK 2: STATIC LOCAL BINARY DISSECTION</text>
  <text x="650" y="306" fill="#c084fc" font-size="12" font-weight="600">100% BROWSER-FREE | Local Executables &amp; Desktop Packages</text>

  <!-- Tool 1: REA Build Metadata -->
  <rect x="650" y="325" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="348" fill="#a855f7" font-size="14" font-weight="600">1. REA Go &amp; Rust Build Information Reader</text>
  <text x="670" y="370" fill="#94a3b8" font-size="12">• Recovers Go compiler version, build tags, and dependency modules</text>
  <text x="670" y="390" fill="#94a3b8" font-size="12">• Recovers rustc version, target triples, panic strategies &amp; crate tree</text>

  <!-- Tool 2: Craft Anything Native -->
  <rect x="650" y="420" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="443" fill="#a855f7" font-size="14" font-weight="600">2. Craft Anything Native, Formats &amp; Apple Toolsets</text>
  <text x="670" y="465" fill="#94a3b8" font-size="12">• Native disassembly, Control Flow Graph (CFG) reconstruction</text>
  <text x="670" y="485" fill="#94a3b8" font-size="12">• Mach-O fat headers, ELF section parsing, Objective-C interface dump</text>

  <!-- Tool 3: Local System Diagnostics -->
  <rect x="650" y="515" width="480" height="85" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="670" y="538" fill="#a855f7" font-size="14" font-weight="600">3. System Diagnostics &amp; Frida Instrumentation</text>
  <text x="670" y="560" fill="#94a3b8" font-size="12">• nm, otool -L, strings -a, and file header mapping</text>
  <text x="670" y="580" fill="#94a3b8" font-size="12">• Headless function hooking &amp; argument inspection</text>

  <!-- Synthesis Track 2 -->
  <rect x="650" y="610" width="480" height="95" rx="8" fill="#3b0764" stroke="#7e22ce"/>
  <text x="670" y="635" fill="#faf5ff" font-size="13" font-weight="700">Track 2 Deliverable: Binary Provenance &amp; Call Graph</text>
  <text x="670" y="658" fill="#e9d5ff" font-size="12">• Precise compiler provenance, flags, and dependency versions</text>
  <text x="670" y="678" fill="#e9d5ff" font-size="12">• Graphify knowledge graph mapping functions, structs &amp; dylibs</text>

  <!-- Bottom Consensus Banner -->
  <rect x="250" y="740" width="700" height="40" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="600" y="765" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">✔ 3-CYCLE HYBRID FLEET CONSENSUS APPROVED FOR PRODUCTION</text>
</svg>
